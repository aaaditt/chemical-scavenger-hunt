<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret Catalyst · Lab shelf (Night / Day Shift)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
body{padding:48px;display:flex;gap:56px;align-items:flex-start;flex-wrap:wrap}
.phone{--bg:var(--wall);--line:var(--seam);--text:var(--clinic);--muted:var(--fog);--plank:var(--bench);--plank-top:var(--tile);
  width:390px;height:844px;position:relative;overflow:hidden;color:var(--text);background-color:var(--bg);
  background-image:linear-gradient(var(--line) 0 4px,transparent 4px),linear-gradient(90deg,var(--line) 0 4px,transparent 4px);background-size:96px 64px}
.phone.day{--bg:#c9d8e2;--line:#b0c3d0;--text:var(--ink);--muted:#34505a;--plank:#5d7380;--plank-top:#8fa5b4}
.phone.day .halo-slot,.phone.day .lamp-halo{display:none}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;height:76px;display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.led{background:var(--bench);color:var(--led);font:400 24px/24px 'Silkscreen';padding:10px 12px;box-shadow:var(--pxb)}
.led .n{font-size:24px}
.meter{background:var(--holo);color:var(--ink);box-shadow:var(--pxb),inset 0 -4px 0 0 var(--holo-deep);padding:4px 10px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.meter .k{font:400 16px/16px 'Silkscreen'}
.meter b{font:400 24px/24px 'Silkscreen'}
.spacer{flex:1}

/* scene (ref-1 corner of the room) */
.scene{position:absolute;top:76px;left:0;right:0;height:172px}
.table{position:absolute;left:0;right:0;top:148px;height:24px;background:var(--plank);box-shadow:inset 0 4px 0 0 var(--plank-top),0 4px 0 0 var(--ink)}
.note{position:absolute;left:20px;top:16px;width:168px;padding:16px 12px 12px;background:var(--parch);color:var(--ink);box-shadow:var(--pxb),inset -4px -4px 0 0 var(--parch-shade)}
.note:before{content:"";position:absolute;left:76px;top:-8px;width:12px;height:12px;background:var(--alarm);box-shadow:0 0 0 4px var(--ink)}
.note h3{font:400 16px/16px 'Silkscreen';margin-bottom:8px}
.note p{font:700 14px/18px 'Atkinson Hyperlegible';margin-top:4px}
.rod{position:absolute;background:#5e676b;box-shadow:inset 4px 0 0 0 #8a9599}
/* Day/Night toggle: icon + the state you'll GO TO. */
.shift{position:absolute;right:16px;top:16px;width:84px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--clinic);color:var(--ink);box-shadow:var(--pxb),inset 0 -4px 0 0 var(--clinic-shade)}
.shift b{font:400 16px/16px 'Silkscreen';text-align:center}

/* tabs */
.tabs{position:absolute;top:252px;left:16px;right:16px;display:flex;gap:12px}
.tab{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font:400 16px/16px 'Silkscreen';box-shadow:var(--pxb)}
.tab .n{font-size:16px}
.tab.on{background:var(--clinic);color:var(--ink)}
.tab.off{background:var(--bench);color:var(--clinic)}
.phone.day .tab.off{background:#b0c3d0;color:var(--ink)}

/* shelf: rows are 140px, so 3 rows end at 724, above the SCAN overhang. In the app this is the scroll container,
   padded at the bottom by the SCAN overhang (32px) so the last row always rests fully visible. */
.shelf{position:absolute;top:304px;left:0;right:0}
.row{display:flex;justify-content:space-between;padding:0 20px}
.cell{width:80px;display:flex;justify-content:center}
.btl{--x:4px;position:relative;width:calc(var(--x)*16);height:calc(var(--x)*20);isolation:isolate}
.btl>svg{position:relative;z-index:1}
.btl .sym{position:absolute;z-index:2;left:calc(var(--x)*4);top:calc(var(--x)*10);width:calc(var(--x)*8);height:calc(var(--x)*4);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--ink)}
.btl.empty .sym{color:var(--moss)}
.phone.day .btl.empty .sym{color:#6f8794}
.halo-slot{position:absolute;z-index:0;left:-16px;top:-8px}
.plank{height:12px;margin:0 8px;background:var(--plank);box-shadow:inset 0 4px 0 0 var(--plank-top),0 4px 0 0 var(--ink)}
.plates{margin-top:4px;margin-bottom:8px}
.plate{width:80px;height:36px;background:var(--clinic);color:var(--ink);box-shadow:var(--pxb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.plate b{font:700 14px/16px 'Atkinson Hyperlegible';white-space:nowrap}
.plate.ghost{background:transparent;color:var(--muted);box-shadow:0 -4px 0 0 var(--moss),0 4px 0 0 var(--moss),-4px 0 0 0 var(--moss),4px 0 0 0 var(--moss)}
.pips{display:flex;gap:4px;height:8px}
.pips i{width:8px;height:8px;background:var(--ink)}
.plate.ghost .pips i{background:var(--moss)}
.pips.hz i{background:repeating-linear-gradient(90deg,var(--hazard) 0 4px,var(--ink) 4px 8px)}

/* nav: 4px ink top edge; SCAN overhangs by 28px */
.nav{position:absolute;left:0;right:0;bottom:0;height:92px;background:var(--bench);box-shadow:0 -4px 0 0 var(--ink);display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.nav a{width:60px;height:56px;display:flex;align-items:center;justify-content:center;font:400 16px/16px 'Silkscreen';color:var(--fog);text-decoration:none}
.nav a.on{background:var(--clinic);color:var(--ink);box-shadow:var(--pxb)}
.scan{width:88px!important;height:88px!important;margin-top:-28px;flex-direction:column;gap:8px;background:var(--candle);color:var(--ink)!important;box-shadow:var(--pxb),inset 0 -8px 0 0 var(--candle-deep)}
.scan span{font:400 16px/16px 'Silkscreen';margin-bottom:4px}
</style>
</head>
<body>

<div><p class="frame-label">01 · LAB SHELF · NIGHT SHIFT (default)</p><div class="phone" id="night"></div></div>
<div><p class="frame-label">02 · LAB SHELF · DAY SHIFT (ref-3, auto-offered 10:00-16:00)</p><div class="phone day" id="day"></div></div>

<script>
const SHELF=[
 [['H','Hydrogen','common'],['O','Oxygen','common'],['C','Carbon','common'],['Cl','Chlorine','common']],
 [['K','Potassium','uncommon'],['Fe','Iron','uncommon'],['Cu','Copper','uncommon',1],['Si','Silicon','uncommon']],
 [['Ag','Silver','rare'],['Li','Lithium','rare',1],['Au','Gold','rare',1],['U','U-235','isotope']]];
function cell([sym,name,tier,ghost]){
  const glow=!ghost&&(tier==='rare'||tier==='isotope');
  const hc=tier==='rare'?'#e4ecf7':'#d4ff2a';
  return `<div class="cell"><div class="btl${ghost?' empty':''}" data-s="bottle" data-t="${tier}" ${ghost?'data-g':''} data-x="4">${glow?`<i class="halo-slot" data-s="halo" data-r="12" data-c="${hc}" data-x="4"></i>`:''}<span class="sym">${sym}</span></div></div>`}
function plate([sym,name,tier,ghost]){return `<div class="cell"><div class="plate${ghost?' ghost':''}"><b>${name}</b><span class="pips${tier==='isotope'?' hz':''}">${'<i></i>'.repeat(PIPN[tier])}</span></div></div>`}
function lab(day){return `
<header class="hud">
  <div class="led">LAB <span class="n">1137</span></div><div class="spacer"></div>
  <div class="meter"><span class="k">SCORE</span><b>412</b></div>
  <div class="meter"><span class="k">RANK</span><b>#17</b></div>
</header>
<section class="scene">
  <div class="note"><h3>LAB NOTES</h3><p>3 new hints in the book.</p><p>Aditi made Ammonia first. 4 min ago.</p></div>
  <i class="abs lamp-halo" data-s="halo" data-r="10" data-c="#ffb547" data-x="4" style="left:208px;top:76px"></i>
  <div class="rod" style="left:200px;top:20px;width:8px;height:132px"></div>
  <div class="rod" style="left:200px;top:36px;width:44px;height:8px"></div>
  <div class="rod" style="left:188px;top:144px;width:36px;height:4px"></div>
  <i class="abs" data-s="bottle" data-t="uncommon" data-x="4" style="left:216px;top:20px"></i>
  <i class="abs" data-s="lamp" data-x="4" style="left:224px;top:100px"></i>
  <div class="shift" aria-label="Switch to ${day?'Night':'Day'} Shift"><i data-s="${day?'moon':'sun'}" data-x="4"></i><b>${day?'NIGHT':'DAY'}<br>SHIFT</b></div>
  <div class="table"></div>
</section>
<nav class="tabs"><div class="tab on">ELEMENTS <span class="n">14/25</span></div><div class="tab off">COMPOUNDS <span class="n">6/52</span></div></nav>
<section class="shelf">
${SHELF.map(r=>`<div class="row">${r.map(cell).join('')}</div><div class="plank"></div><div class="row plates">${r.map(plate).join('')}</div>`).join('')}
</section>
<nav class="nav"><a class="on">LAB</a><a>MIX</a><a class="scan"><i data-s="qr" data-x="4"></i><span>SCAN</span></a><a>HINTS</a><a>CREW</a></nav>`}
document.getElementById('night').innerHTML=lab(false);
document.getElementById('day').innerHTML=lab(true);
mount();
</script>
</body>
</html>
