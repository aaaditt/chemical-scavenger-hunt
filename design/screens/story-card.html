<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret Catalyst · Story card 1080x1920 · compound synthesized (public, during play)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<!-- STORY SCALE: 1 art px = 12 CSS px (phone 4 x 3). Hero close-up = 24.
     IG safe area: everything that matters sits inside y 240-1680.
     PUBLIC SURFACE: no formula, no catalyst name or color, no lender. Sealed flask + CATALYZED ? chip until the finale recap.
     The safe-area guides only render with #guides in the URL, so the next/og template can never ship them. -->
<style>
:root{--pxb:0 -12px 0 0 var(--ink),0 12px 0 0 var(--ink),-12px 0 0 0 var(--ink),12px 0 0 0 var(--ink)}
body{background:#000}
.card{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--clinic);background-color:var(--wall);
  background-image:linear-gradient(var(--seam) 0 12px,transparent 12px),linear-gradient(90deg,var(--seam) 0 12px,transparent 12px);background-size:288px 192px}
.safe{display:none;position:absolute;left:0;right:0;height:0;border-top:4px dashed rgba(255,75,62,.5);z-index:9}
.safe span{position:absolute;right:12px;top:4px;font:400 24px 'Silkscreen';color:rgba(255,75,62,.8)}
.guides .safe{display:block}
.brand{position:absolute;left:72px;right:72px;top:248px;display:flex;align-items:center;justify-content:space-between}
.brand .lg{font:400 64px/64px 'Silkscreen'}
.brand .lg .a{color:var(--clinic)}.brand .lg .b{color:var(--candle)}
.brand .tag{background:var(--ink);color:var(--led);font:400 32px/32px 'Silkscreen';padding:12px 16px;box-shadow:var(--pxb)}
.stamp{position:absolute;z-index:3;left:0;right:0;margin:0 auto;width:max-content;top:348px;background:var(--bench);color:var(--led);font:400 96px/96px 'Silkscreen';padding:24px 36px;box-shadow:var(--pxb);white-space:nowrap}
/* owner plate on label stock, under the stamp */
.owner{position:absolute;z-index:3;left:0;right:0;margin:0 auto;width:max-content;top:528px;background:var(--clinic);color:var(--ink);font:400 32px/32px 'Silkscreen';padding:12px 24px;box-shadow:var(--pxb)}
.owner .n{font-size:32px}
/* stepped halo (r11, 2x2-block octagon at 24px) ends at y1116; hero name starts at y1140 on plain wall */
.hl{position:absolute;left:276px;top:588px}
.fl{position:absolute;left:348px;top:612px}
.plank{position:absolute;left:300px;top:1092px;width:480px;height:36px;background:var(--bench);box-shadow:inset 0 12px 0 0 var(--tile),0 12px 0 0 var(--ink)}
.big{position:absolute;left:0;right:0;text-align:center}
.nm{top:1140px;font:400 144px/144px 'Silkscreen';color:#fff}
.row{top:1300px;display:flex;justify-content:center;align-items:center;gap:36px}
.pts{height:96px;display:flex;align-items:center;background:var(--holo);color:var(--ink);font:400 64px/64px 'Silkscreen';padding:0 24px;box-shadow:var(--pxb),inset 0 -12px 0 0 var(--holo-deep)}
.cz{height:96px;display:flex;align-items:center;gap:16px;background:var(--parch);color:var(--ink);font:400 40px/40px 'Silkscreen';padding:0 24px 0 6px;box-shadow:var(--pxb),inset 0 -12px 0 0 var(--parch-shade)}
.note{position:absolute;left:96px;right:96px;top:1420px;background:var(--parch);color:var(--ink);padding:16px 36px;box-shadow:var(--pxb),inset -12px -12px 0 0 var(--parch-shade)}
.note:before{content:"";position:absolute;right:72px;top:-24px;width:36px;height:36px;background:var(--alarm);box-shadow:0 0 0 12px var(--ink)}
.note b{display:block;font:400 48px/48px 'Silkscreen'}
.note p{font:700 40px/48px 'Atkinson Hyperlegible';margin-top:8px}
.cta{position:absolute;left:96px;right:96px;top:1572px;display:flex;align-items:center;gap:36px}
.cta .qr{background:var(--clinic);padding:0;box-shadow:var(--pxb)}
.cta p{font:700 36px/44px 'Atkinson Hyperlegible';color:var(--clinic)}
.cta p b{color:var(--candle)}
</style>
</head>
<body>
<div class="card" id="card">
  <i class="abs" id="hzT" style="left:0;top:0"></i>
  <div class="brand"><span class="lg"><span class="a">SECRET</span> <span class="b">CATALYST</span></span><span class="tag">BITS DUBAI</span></div>
  <div class="stamp">SYNTHESIZED</div>
  <div class="owner">MEERA K · LAB <span class="n">1137</span></div>
  <i class="hl" id="halo"></i>
  <i class="fl" id="flask"></i>
  <div class="plank"></div>
  <div class="big nm">AMMONIA</div>
  <div class="big row"><span class="pts">+20</span><span class="cz"><i id="qi"></i>CATALYZED ?</span></div>
  <div class="note"><b>FIRST ON CAMPUS</b><p>Nobody made Ammonia before 15:42.</p></div>
  <div class="cta"><i class="qr" id="qr"></i><p>Hunt the QRs. Borrow a catalyst.<br><b>Beat this.</b></p></div>
  <i class="abs" id="hzB" style="left:0;top:1872px"></i>

  <div class="safe" style="top:240px"><span>IG SAFE TOP</span></div>
  <div class="safe" style="top:1680px"><span>IG SAFE BOTTOM</span></div>
</div>
<script>
if(location.hash==='#guides')document.getElementById('card').classList.add('guides');
document.getElementById('hzT').innerHTML=hazard(90,4,12);
document.getElementById('hzB').innerHTML=hazard(90,4,12);
document.getElementById('halo').innerHTML=halo(11,'#ffb547',24,2);   /* candle, never the catalyst's color */
document.getElementById('flask').innerHTML=flask('',24,{sealed:true}); /* hero close-up: exactly 2x story scale */
document.getElementById('qi').innerHTML=spr('q7',12);
document.getElementById('qr').innerHTML=spr('qr',12);                /* placeholder: the real join QR is generated at render time */
</script>
</body>
</html>
