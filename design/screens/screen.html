<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret Catalyst · Big screen (projector, 1920x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<!-- Browsers skip Tailwind's @theme block, so the token values are mirrored below as short vars.
     PROJECTOR SCALE: 1 art px = 8 CSS px (the phone's 4, doubled). Hero sprite = 16. Every size is a multiple of 8. -->
<style>
:root{--ink:#071312;--bench:#0b1a19;--wall:#12302c;--seam:#0d2521;--tile:#1e4640;--moss:#2a5c54;--fog:#8fb0a8;--clinic:#dce7ee;--clinic-shade:#a9bcc8;--parch:#eadf9e;--parch-shade:#c9b96a;--holo:#43e6c6;--holo-deep:#1fa88e;--led:#8df25f;--candle:#ffb547;--candle-deep:#d9851c;--alarm:#ff4b3e;--hazard:#f7c61b;--frost:#bdf4ff;--iso:#d4ff2a;--pressure:#a57bff;
--pxb:0 -8px 0 0 var(--ink),0 8px 0 0 var(--ink),-8px 0 0 0 var(--ink),8px 0 0 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;margin:0}
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;color:var(--clinic);font-family:'Atkinson Hyperlegible',sans-serif;background-color:var(--wall);
  background-image:linear-gradient(var(--seam) 0 8px,transparent 8px),linear-gradient(90deg,var(--seam) 0 8px,transparent 8px);background-size:192px 128px}
.sprite{display:block;image-rendering:pixelated}
.abs{position:absolute}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:136px;background:var(--bench);box-shadow:0 8px 0 0 var(--ink);display:flex;align-items:center;gap:32px;padding:0 64px}
.logo{display:flex;align-items:center;gap:24px;font:700 64px/64px 'Pixelify Sans';letter-spacing:.02em}
.logo .a{color:var(--clinic)}.logo .b{color:var(--candle)}
.sp{flex:1}
.race{display:flex;gap:24px}
.race div{background:var(--clinic);color:var(--ink);padding:8px 16px;box-shadow:var(--pxb)}
.race .k{display:block;font:700 16px/16px 'Pixelify Sans';letter-spacing:.06em}
.race b{font:700 32px/40px 'Atkinson Hyperlegible'}
.race b span{font-family:'Pixelify Sans'}
.clock{background:var(--ink);color:var(--led);padding:8px 24px;box-shadow:var(--pxb);text-align:right}
.clock .k{display:block;font:700 16px/16px 'Pixelify Sans';color:var(--led);letter-spacing:.08em}
.clock b{font:700 64px/64px 'Pixelify Sans'}
.clock .colon{animation:blink 1000ms steps(1,end) infinite}

/* leaderboard */
.board{position:absolute;left:64px;top:184px;width:1016px}
.head{display:flex;align-items:center;gap:24px;margin-bottom:24px}
.head .led{background:var(--ink);color:var(--holo);font:700 40px/40px 'Pixelify Sans';padding:8px 16px;box-shadow:var(--pxb)}
.head .sub{font:700 24px/32px 'Atkinson Hyperlegible';color:var(--clinic)}
.rows{display:flex;flex-direction:column;gap:8px}
.r{height:64px;display:flex;align-items:center;gap:24px;padding-right:24px;background:var(--bench);box-shadow:var(--pxb)}
.r .n{width:88px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--clinic);font:700 40px/1 'Pixelify Sans'}
.r .mv{width:40px;display:flex;justify-content:center}
.r .who{flex:1;font:700 36px/40px 'Atkinson Hyperlegible';white-space:nowrap}
.r .who small{font:700 24px 'Atkinson Hyperlegible';color:var(--clinic-shade);margin-left:16px}
.r .cmp{display:flex;align-items:center;gap:8px;font:700 32px 'Pixelify Sans';color:var(--clinic);width:120px}
.r .sc{font:700 48px/1 'Pixelify Sans';color:var(--holo);width:160px;text-align:right}
.r.podium{background:var(--clinic);color:var(--ink)}
.r.podium .n{background:var(--ink);color:var(--clinic)}
.r.podium.first .n{background:var(--candle);color:var(--ink)}
.r.podium .who small{color:#34505a}
.r.podium .cmp{color:var(--ink)}
.r.podium .sc{color:var(--ink)}

/* first discovery hero */
.hero{position:absolute;left:1144px;top:184px;width:712px;height:456px;background:var(--bench);box-shadow:var(--pxb);overflow:hidden}
.hero .stamp{position:absolute;z-index:2;left:24px;top:24px;background:var(--candle);color:var(--ink);font:700 32px/1 'Pixelify Sans';padding:8px 16px;box-shadow:var(--pxb),inset 0 -8px 0 0 var(--candle-deep);animation:stamp 240ms steps(3,end) both}
.hero .hl{position:absolute;left:8px;top:112px}
.hero .fl{position:absolute;left:40px;top:112px}
.hero .txt{position:absolute;left:320px;top:128px;right:24px}
.hero .lent{font:700 28px/32px 'Atkinson Hyperlegible';color:var(--clinic)}
.hero .nm{font:700 96px/88px 'Pixelify Sans';color:#fff}
.hero .fm{font:700 40px/48px 'Pixelify Sans';color:var(--clinic);margin-top:8px}
.hero .fm sub{font-size:24px;vertical-align:-8px}
.hero .by{font:700 32px/40px 'Atkinson Hyperlegible';margin-top:16px}
.hero .ctag{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--pressure);color:var(--ink);font:700 24px 'Pixelify Sans';padding:4px 12px 4px 4px;box-shadow:var(--pxb)}

/* live feed */
.feed{position:absolute;left:1144px;top:672px;width:712px}
.feed .led{display:inline-block;background:var(--ink);color:var(--holo);font:700 32px/32px 'Pixelify Sans';padding:8px 16px;box-shadow:var(--pxb);margin-bottom:24px}
.ev{display:flex;align-items:center;gap:16px;height:56px;margin-bottom:8px}
.ev time{font:700 24px 'Pixelify Sans';color:var(--led);width:80px}
.ev .ic{width:48px;display:flex;justify-content:center}
.ev p{font:700 28px/32px 'Atkinson Hyperlegible';color:var(--clinic);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev p b{color:#fff}
.ev.hot{background:var(--iso);margin-left:-16px;padding-left:16px;box-shadow:var(--pxb)}
.ev.hot time,.ev.hot p,.ev.hot p b{color:var(--ink)}

/* ticker */
.tick{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--ink);overflow:hidden}
.tick .hzb{position:absolute;left:0;top:0}
.tick .lane{position:absolute;left:0;top:16px;height:48px;display:flex;align-items:center;white-space:nowrap;font:700 32px/48px 'Pixelify Sans';color:var(--hazard);animation:marquee 24s steps(240,end) infinite}
.tick .lane span{padding:0 48px}

.bub{animation:bubble 1200ms steps(6,end) infinite}
@keyframes bubble{0%{transform:translateY(0);opacity:1}83%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes stamp{from{transform:scale(1.75);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script>
/* ===== Secret Catalyst pixel sprite kit (subset). 1 char = 1 art pixel. ===== */
const P={k:'#071312',K:'#071312',g:'#183b36',G:'#2c5a52',w:'#e9fff9',l:'#dce7ee',m:'#a9bcc8',c:'#9a7048',C:'#5e4026',Y:'#f7c61b',o:'#ff5a36',y:'#ffb547',W:'#fff4c2',S:'#ffe14a',Z:'#d9a400',f:'#dce7ee',P:'#a57bff',E:'#4db2ff',N:'#4bf08b',n:'#b9ffd2',Q:'#ff5fae',q:'#b8306e',F:'#bdf4ff',j:'#6cc9e6'};
const LIQ={pressure:{L:'#a57bff',D:'#6c46c9',H:'#d9c7ff'},isotope:{L:'#d4ff2a',D:'#8dc20a',H:'#f3ffb0'}};
const SPR={
erlen:["................",".....kkkkkk.....",".....kcccck.....","......kkkk......","......kwgk......","......kwgk......","......kwgk......",".....kwgggk.....",".....kwgggk.....","....kHHHHHHk....","....kwLLLLLk....","...kwLLLLLLLk...","...kLLLLLLLLk...","..kLLLLLLLLLLk..","..kLLLLLLLLLLk..",".kLLLLLLLLLLLLk.",".kLLLLLLLLLLLLk.","kDLLLLLLLLLLLLDk","kDDDDDDDDDDDDDDk","kkkkkkkkkkkkkkkk"],
mini:["..kk..",".kwgk.","kHHHHk","kLLLLk","kLLLLk",".kkkk."],
/* 7x7 "feed glyphs": the projector's small icon size, so every sprite on this canvas stays at 8 CSS px per art px. */
flame7:["...k...","..kok..",".koyok.",".koyok.","koyWyok","koyWyok",".kkkkk."],
gauge7:[".kkkkk.","kPPPPPk","kPffkPk","kPfkfPk","kPkffPk","kPPPPPk",".kkkkk."],
star:["...k...","..kSk..","kkSWSkk","kSSSSSk",".kSSSk.","kSSkSSk","kk...kk"],
flake:["...F...",".F.F.F.","..FFF..","FFFjFFF","..FFF..",".F.F.F.","...F..."],
haz:["kkkkkkk","kYkYkYk","kkYkYkk","kYkYkYk","kkkkkkk"],
up:["..k..",".kNk.","kNNNk"],
dn:["kQQQk",".kQk.","..k.."]
};
function rects(rows,pal={},ox=0,oy=0){let s='';rows.forEach((row,y)=>{let x=0;while(x<row.length){const ch=row[x];if(ch==='.'){x++;continue}let e=x;while(e<row.length&&row[e]===ch)e++;const col=pal[ch]||P[ch];if(col)s+=`<rect x="${x+ox}" y="${y+oy}" width="${e-x}" height="1" fill="${col}"/>`;x=e}});return s}
function wrap(w,h,sc,inner,cls=''){return `<svg class="sprite ${cls}" width="${w*sc}" height="${h*sc}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`}
function spr(name,sc,pal){const r=SPR[name];return wrap(r[0].length,r.length,sc,rects(r,pal))}
function bubbles(list){return list.map(([x,y],i)=>`<rect class="bub" x="${x}" y="${y}" width="1" height="1" fill="#ffffff" style="animation-delay:${-i*400}ms"/>`).join('')}
function halo(r,color,sc){let s='';const d=r*2;for(let y=0;y<d;y++){let x=0;while(x<d){const al=a=>{const t=Math.hypot(a+.5-r,y+.5-r);return t<r*.55?.38:t<r?.16:0};const v=al(x);let e=x;while(e<d&&al(e)===v)e++;if(v)s+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${color}" fill-opacity="${v}"/>`;x=e}}return wrap(d,d,sc,s)}
function hazard(w,h,sc,band=4){let s='';for(let y=0;y<h;y++){let x=0;const v0=a=>Math.floor((a+y)/band)%2;while(x<w){const v=v0(x);let e=x;while(e<w&&v0(e)===v)e++;s+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${v?'#071312':'#f7c61b'}"/>`;x=e}}return wrap(w,h,sc,s)}
</script>
</head>
<body>
<div class="stage">

  <header class="top">
    <div class="logo"><span class="a">SECRET</span><span class="b">CATALYST</span></div>
    <div class="sp"></div>
    <div class="race">
      <div><span class="k">SPEED CHEMIST</span><b>Meera K · <span>14</span></b></div>
      <div><span class="k">MASTER OF THE OBSCURE</span><b>Zaid R · <span>245</span></b></div>
    </div>
    <div class="clock"><span class="k">LAB CLOSES IN</span><b>01<span class="colon">:</span>47</b></div>
  </header>

  <section class="board">
    <div class="head"><span class="led">LEADERBOARD</span><span class="sub">312 labs open · 41 compounds found so far</span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="hero">
    <span class="stamp">FIRST ON CAMPUS</span>
    <i class="hl" id="hl"></i>
    <i class="fl" id="fl"></i>
    <div class="txt">
      <div class="nm">UREA</div>
      <div class="fm">CH<sub>4</sub>N<sub>2</sub>O · +25</div>
      <div class="by">Meera K, 15:42</div>
      <div class="lent">Rohan lent the Pressure.</div>
      <span class="ctag"><i id="ci"></i>PRESSURE</span>
    </div>
  </section>

  <section class="feed">
    <span class="led">LIVE</span>
    <div id="feed"></div>
  </section>

  <footer class="tick">
    <i class="hzb" id="hz"></i>
    <div class="lane" id="lane"></div>
  </footer>
</div>

<script>
const ROWS=[
 [1,'Meera K','The Fumes',14,612,'up'],[2,'Zaid R','',11,588,'dn'],[3,'Aisha N','Salt Bae Labs',12,551,''],
 [4,'Rohan S','The Fumes',9,497,'up'],[5,'Kabir M','',10,476,''],[6,'Sara A','Noble Gasses',8,455,'up'],
 [7,'Dev P','Noble Gasses',9,431,'dn'],[8,'Hana Q','',7,402,''],[9,'Arjun T','Salt Bae Labs',8,389,'up'],[10,'Lina F','',6,377,'dn']];
document.getElementById('rows').innerHTML=ROWS.map(([n,who,crew,c,s,mv])=>`
 <div class="r${n<=3?' podium':''}${n===1?' first':''}"><span class="n">${n}</span>
  <span class="mv">${mv?spr(mv,8):''}</span>
  <span class="who">${who}${crew?`<small>${crew}</small>`:''}</span>
  <span class="cmp">${spr('mini',8,{L:n<=3?'#43e6c6':'#43e6c6',H:'#b5fff8'})}${c}</span>
  <span class="sc">${s}</span></div>`).join('');
let fl=rects(SPR.erlen,LIQ.pressure)+bubbles([[5,16],[8,14],[10,17]]);
document.getElementById('fl').innerHTML=wrap(16,20,16,fl);          /* hero close-up: exactly 2x projector scale */
document.getElementById('hl').innerHTML=halo(10,'#a57bff',16);
document.getElementById('ci').innerHTML=spr('gauge7',8);
const FEED=[
 ['15:44','haz','<b>U-235 drop:</b> 7 of 10 claimed',1],
 ['15:42','star','<b>Meera K</b> made Urea first.'],
 ['15:41','flake','<b>Lab 2208</b> froze. Three bad mixes.'],
 ['15:39','flame7','<b>Aisha N</b> lent Heat. 9th time.']];
document.getElementById('feed').innerHTML=FEED.map(([t,ic,txt,hot])=>`<div class="ev${hot?' hot':''}"><time>${t}</time><span class="ic">${spr(ic,8)}</span><p>${txt}</p></div>`).join('');
document.getElementById('hz').innerHTML=hazard(240,2,8);
const T=['BLACK MARKET OPENS AT 16:00','ONE PLAY EACH: SAFE +100 OR GAMBLE','4 COMPOUNDS NOBODY HAS MADE YET','SOMEBODY IN THIS ROOM HOLDS ACID'];
document.getElementById('lane').innerHTML=(T.concat(T)).map(t=>`<span>${t}</span>`).join('<span>///</span>');
</script>
</body>
</html>
