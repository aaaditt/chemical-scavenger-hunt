<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret Catalyst · Big screen (projector, 1920x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<!-- PROJECTOR SCALE: 1 art px = 8 CSS px (the phone's 4, doubled). Hero sprite = 16. Every size is a multiple of 8.
     PUBLIC SURFACE: during play it never shows a catalyst name or color, a formula, or a lender's name. -->
<style>
:root{--pxb:0 -8px 0 0 var(--ink),0 8px 0 0 var(--ink),-8px 0 0 0 var(--ink),8px 0 0 0 var(--ink)}
body{background:#000;margin:0}
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;color:var(--clinic);background-color:var(--wall);
  background-image:linear-gradient(var(--seam) 0 8px,transparent 8px),linear-gradient(90deg,var(--seam) 0 8px,transparent 8px);background-size:192px 128px}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:136px;background:var(--bench);box-shadow:0 8px 0 0 var(--ink);display:flex;align-items:center;gap:32px;padding:0 64px}
.logo{display:flex;align-items:center;gap:24px;font:400 64px/64px 'Silkscreen'}
.logo .a{color:var(--clinic)}.logo .b{color:var(--candle)}
.sp{flex:1}
.race{display:flex;gap:24px}
.race div{background:var(--clinic);color:var(--ink);padding:8px 16px;box-shadow:var(--pxb)}
.race .k{display:block;font:400 24px/24px 'Silkscreen';margin-bottom:4px}
.race b{font:700 32px/40px 'Atkinson Hyperlegible'}
.clock{background:var(--ink);color:var(--led);padding:8px 24px;box-shadow:var(--pxb);text-align:right}
.clock .k{display:block;font:400 24px/24px 'Silkscreen';color:var(--led);margin-bottom:4px}
.clock b{font:400 64px/64px 'Silkscreen'}
.clock .colon{animation:blink 1000ms steps(1,end) infinite}

/* leaderboard */
.board{position:absolute;left:64px;top:176px;width:1016px}
.head{display:flex;align-items:center;gap:24px;margin-bottom:16px}
.head .led{background:var(--ink);color:var(--holo);font:400 40px/40px 'Silkscreen';padding:8px 16px;box-shadow:var(--pxb)}
.head .sub{font:700 28px/32px 'Atkinson Hyperlegible';color:var(--clinic)}
.cols{display:flex;gap:24px;padding-right:24px;height:32px;align-items:center;margin-bottom:8px;font:400 24px/24px 'Silkscreen';color:var(--clinic)}
.cols .who{flex:1;padding-left:176px}
.cols .cmp{width:176px}.cols .sc{width:160px;text-align:right}
.rows{display:flex;flex-direction:column;gap:8px}
.r{height:64px;display:flex;align-items:center;gap:24px;padding-right:24px;background:var(--bench);box-shadow:var(--pxb)}
.r .n{width:88px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--clinic);font:400 40px/40px 'Silkscreen'}
.r .mv{width:40px;display:flex;justify-content:center}
.r .who{flex:1;font:700 36px/40px 'Atkinson Hyperlegible';white-space:nowrap}
.r .who small{font:700 24px 'Atkinson Hyperlegible';color:var(--clinic-shade);margin-left:16px}
.r .cmp{display:flex;align-items:center;gap:8px;font:400 32px/32px 'Silkscreen';color:var(--clinic);width:176px}
.r .sc{font:400 48px/48px 'Silkscreen';color:var(--holo);width:160px;text-align:right}
.r.podium{background:var(--clinic);color:var(--ink)}
.r.podium .n{background:var(--ink);color:var(--clinic)}
.r.podium.first .n{background:var(--candle);color:var(--ink)}
.r.podium .who small{color:#34505a}
.r.podium .cmp,.r.podium .sc{color:var(--ink)}

/* first discovery hero: sealed flask, candle-colored stepped halo (the catalyst's color would out it) */
.hero{position:absolute;left:1144px;top:176px;width:712px;height:464px;background:var(--bench);box-shadow:var(--pxb);overflow:hidden}
.hero .stamp{position:absolute;z-index:2;left:24px;top:24px;background:var(--candle);color:var(--ink);font:400 32px/32px 'Silkscreen';padding:8px 16px;box-shadow:var(--pxb),inset 0 -8px 0 0 var(--candle-deep);animation:stamp 240ms steps(3,end) both}
.hero .hl{position:absolute;left:8px;top:112px}
.hero .fl{position:absolute;left:40px;top:112px}
.hero .txt{position:absolute;left:352px;top:120px;right:24px}
.hero .nm{font:400 96px/96px 'Silkscreen';color:#fff}
.hero .chips{display:flex;gap:24px;align-items:center;margin-top:24px}
.hero .pts{background:var(--holo);color:var(--ink);font:400 40px/40px 'Silkscreen';padding:8px 16px;box-shadow:var(--pxb),inset 0 -8px 0 0 var(--holo-deep)}
.hero .cz{display:flex;align-items:center;gap:12px;background:var(--parch);color:var(--ink);font:400 24px/24px 'Silkscreen';padding:8px 16px 8px 8px;box-shadow:var(--pxb)}
.hero .by{font:700 32px/40px 'Atkinson Hyperlegible';margin-top:24px}
.hero .later{font:700 28px/32px 'Atkinson Hyperlegible';color:var(--clinic-shade);margin-top:8px}

/* live feed */
.feed{position:absolute;left:1144px;top:672px;width:712px}
.feed .led{display:inline-block;background:var(--ink);color:var(--holo);font:400 32px/32px 'Silkscreen';padding:8px 16px;box-shadow:var(--pxb);margin-bottom:24px}
.ev{display:flex;align-items:center;gap:16px;height:56px;margin-bottom:8px}
.ev time{font:400 24px/24px 'Silkscreen';color:var(--led);width:96px}
.ev .ic{width:56px;display:flex;justify-content:center}
.ev p{font:700 28px/32px 'Atkinson Hyperlegible';color:var(--clinic);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev p b{color:#fff}
.ev.hot{background:var(--t-iso);margin-left:-16px;padding-left:16px;box-shadow:var(--pxb)}
.ev.hot time,.ev.hot p,.ev.hot p b{color:var(--ink)}

/* ticker */
.tick{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--ink);overflow:hidden}
.tick .hzb{position:absolute;left:0;top:0}
.tick .lane{position:absolute;left:0;top:16px;height:48px;display:flex;align-items:center;white-space:nowrap;font:400 32px/48px 'Silkscreen';color:var(--hazard);animation:marquee 24s steps(240,end) infinite}
.tick .lane .n{font-size:32px;font-style:normal}
.tick .lane span{padding:0 48px}
.tick .lane span .n{padding:0}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="stage">

  <header class="top">
    <div class="logo"><span class="a">SECRET</span><span class="b">CATALYST</span></div>
    <div class="sp"></div>
    <div class="race">
      <div><span class="k">SPEED CHEMIST</span><b>Meera K · 14 compounds</b></div>
      <div><span class="k">MASTER OF THE OBSCURE</span><b>Zaid R · 248 pts</b></div>
    </div>
    <div class="clock"><span class="k">LAB CLOSES IN</span><b>01<span class="colon">:</span>47</b></div>
  </header>

  <section class="board">
    <div class="head"><span class="led">LEADERBOARD</span><span class="sub">312 labs open · 41 compounds found so far</span></div>
    <div class="cols"><span class="who">PLAYER</span><span class="cmp">COMPOUNDS</span><span class="sc">SCORE</span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="hero">
    <span class="stamp">FIRST ON CAMPUS</span>
    <i class="hl" id="hl"></i>
    <i class="fl" id="fl"></i>
    <div class="txt">
      <div class="nm">UREA</div>
      <div class="chips"><span class="pts">+25</span><span class="cz"><i id="ci"></i>CATALYZED ?</span></div>
      <div class="by">Meera K, 15:42</div>
      <div class="later">How? Revealed at the finale.</div>
    </div>
  </section>

  <section class="feed">
    <span class="led">LIVE</span>
    <div id="feed"></div>
  </section>

  <footer class="tick">
    <i class="hzb" id="hz"></i>
    <div class="lane" id="lane"></div>
  </footer>
</div>

<script>
const ROWS=[
 [1,'Meera K','The Fumes',14,612,'up'],[2,'Zaid R','',11,588,'dn'],[3,'Aisha N','Salt Bae Labs',12,551,''],
 [4,'Rohan S','The Fumes',9,497,'up'],[5,'Kabir M','',10,476,''],[6,'Sara A','Noble Gasses',8,455,'up'],
 [7,'Dev P','Noble Gasses',9,431,'dn'],[8,'Hana Q','',7,402,''],[9,'Arjun T','Salt Bae Labs',8,389,'up'],[10,'Lina F','',6,377,'dn']];
document.getElementById('rows').innerHTML=ROWS.map(([n,who,crew,c,s,mv])=>`
 <div class="r${n<=3?' podium':''}${n===1?' first':''}"><span class="n">${n}</span>
  <span class="mv">${mv?spr(mv,8):''}</span>
  <span class="who">${who}${crew?`<small>${crew}</small>`:''}</span>
  <span class="cmp">${spr('mini',8,{L:'#43e6c6',H:'#b5fff8'})}${c}</span>
  <span class="sc">${s}</span></div>`).join('');
document.getElementById('fl').innerHTML=flask('',16,{sealed:true});     /* hero close-up: exactly 2x projector scale */
document.getElementById('hl').innerHTML=halo(10,'#ffb547',16,2);
document.getElementById('ci').innerHTML=spr('q7',8);
const FEED=[
 ['15:44','haz','<b>U-235 drop:</b> 7 of 10 claimed',1],
 ['15:42','star','<b>Meera K</b> made Urea first.'],
 ['15:41','flake','<b>Lab 2208</b> froze. Three bad mixes.'],
 ['15:39','q7','<b>Aisha N</b> lent a catalyst. 9th time.']];
document.getElementById('feed').innerHTML=FEED.map(([t,ic,txt,hot])=>`<div class="ev${hot?' hot':''}"><time>${t}</time><span class="ic">${spr(ic,8)}</span><p>${txt}</p></div>`).join('');
document.getElementById('hz').innerHTML=hazard(240,2,8);
const T=['BLACK MARKET OPENS AT <i class="n">16:00</i>','ONE PLAY EACH: SAFE <i class="n">+100</i> OR GAMBLE','<i class="n">4</i> COMPOUNDS NOBODY HAS MADE YET','SOMEBODY IN THIS ROOM HOLDS WHAT YOU NEED'];
document.getElementById('lane').innerHTML=(T.concat(T)).map(t=>`<span>${t}</span>`).join('<span>///</span>');
</script>
</body>
</html>
